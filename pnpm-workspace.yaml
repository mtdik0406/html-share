allowBuilds:
  # esbuild の本体は OS ごとの optional 依存として入るので、postinstall（本体の確認）は不要。
  esbuild: false

# 公開から 14 日（分で指定）たっていない版は入れない。乗っ取られた版は数日で見つかり、取り下げられることが多いため。
minimumReleaseAge: 20160

# package.json の engines に合わない Node では入れない。
engineStrict: true

# Stryker が固定している版に、Dependabot が知らせた脆弱性がある（minimatch・qs、開発用）。
# Stryker が直した版を出すまで、直った版に差し替える。外すときは pnpm why で親の版を確かめる。
overrides:
  minimatch: ^11.0.1
  qs: ^6.16.1
