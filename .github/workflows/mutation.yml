name: mutation

# 全体の変異テストは 25 分ほどかかるので、ブランチの push ごとには流さない（ADR 19）。
# main に入ったときと、手で選んだブランチで流し、スコアが stryker.config.json の break を下回ったら落ちる。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 続けて push したら、古いほうの実行を止める。最新のコミットのスコアだけを見るため。
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    # 全体の実行は 25 分ほど。止まったときに、既定の 6 時間まで走らせない。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      # 変異のスコアが stryker.config.json の break を下回ったら落ちる。
      - run: pnpm run test:mutation
