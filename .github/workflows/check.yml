name: check

# PR を使わず、ブランチの push の成功を見てから main に取り込む。pull_request では流さない（push と重ねない）。
# タグの push では流さない。
on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # action はタグではなくコミットで固定する。タグは付け替えられるため。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 採用した ADR の書き換えを、最初の版と比べて見つけるため。
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # 汚染されたキャッシュを持ち込まないよう、毎回 lockfile から入れ直す。
          package-manager-cache: false
      # pnpm の版は package.json の packageManager に従う。
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # リリースの gitleaks_<版>_checksums.txt にある値。
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 履歴のすべてのコミットを調べるため。
          fetch-depth: 0
      # gitleaks の Action は使わない。既定で PR へのコメントと結果のアップロードを行い、トークンも要るため。
      # バイナリを照合してから実行する。
      - run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # 見つけた値は、ログに出さない。
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'
